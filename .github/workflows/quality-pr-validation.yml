name: Quality PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/qualidade-controle-documentos]

concurrency:
  group: quality-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rh-dp-solicitacoes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rh-dp-solicitacoes/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate --schema ./prisma/schema.prisma

      - name: Validate TypeScript
        run: npm run lint

      - name: Run Quality tests
        run: |
          node tests/document-original-download-quality-static.test.cjs
          node tests/document-cancel-quality-audit-static.test.cjs
          node tests/document-quality-management-access-static.test.cjs
          node tests/quality-requested-features-static.test.cjs

      - name: Run full automated test suite
        run: npm test

      - name: Build application
        run: npm run build
