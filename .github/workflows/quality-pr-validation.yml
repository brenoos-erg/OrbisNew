name: Quality PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/qualidade-controle-documentos]

concurrency:
  group: quality-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rh-dp-solicitacoes
    env:
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/test
      JWT_SECRET: